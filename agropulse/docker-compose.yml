version: "3.9"
services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: agropulse
      POSTGRES_PASSWORD: agropulse
      POSTGRES_DB: agropulse
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://agropulse:agropulse@postgres:5432/agropulse
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  worker:
    build: ./backend
    env_file: .env.example
    depends_on: [redis, postgres]
    command: celery -A app.workers.celery_app.celery worker --loglevel=info
  beat:
    build: ./backend
    depends_on: [redis]
    command: celery -A app.workers.celery_app.celery beat --loglevel=info
  web:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
volumes:
  pgdata:
