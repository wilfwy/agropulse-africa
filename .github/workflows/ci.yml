name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r agropulse/backend/requirements.txt
      - run: python -m compileall agropulse/backend/app
      - run: pytest agropulse/backend/tests -q || echo "no tests yet"
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agropulse-api:latest ./agropulse/backend
