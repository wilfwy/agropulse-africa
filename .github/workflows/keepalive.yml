name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          URL="${{ secrets.RENDER_API_URL }}"
          if [ -z "$URL" ]; then URL="https://agropulse-api-eo5o.onrender.com/api/v1"; fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 120 "$URL/health")
          echo "health=$CODE"
          test "$CODE" = "200"
