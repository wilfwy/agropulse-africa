services:
  - type: web
    name: agropulse-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: agropulse/backend/Dockerfile
    dockerContext: agropulse/backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: S3_BUCKET
        value: agropulse-data
